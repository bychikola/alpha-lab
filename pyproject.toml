[project]
name = "alpha-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.15",
    "duckdb>=1.0",
    "pyarrow>=15",
    "requests>=2.31",
    "numba>=0.60",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
alpha-lab = "alpha_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_causality: тест обязан прогнать настоящий причинностный harness из alpha_lab.causality (без дешёвой подмены из autouse-фикстуры)",
]
