<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Lab — отчёт</title>
<!-- Шрифты — единственная внешняя зависимость; без сети страница читается
     системными Inter/system-ui и ui-monospace из стека style.css. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="logo">AL</span>
      <span class="brand-name">Alpha<span class="dot">·</span>Lab</span>
    </div>
    <div class="top-meta mono" id="top-meta">отчёт валидации</div>
  </div>
</header>

<div class="wrap">
  <div id="app"></div>
  <div class="footer">
    Alpha Lab · данные Binance USDT-M · отчёт читается локально, без сервера
  </div>
</div>

<!-- Данные подключаются как скрипт: fetch() к file:// блокируется CORS,
     поэтому writer отдаёт report.js, а не только report.json. -->
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
