# ═══════════════════════════════════════════════════════════════════════════
# ГИПОТЕЗА H2: порог входа по ЭМПИРИЧЕСКОМУ КВАНТИЛЮ вместо k·σ.
#
# ГИПОТЕЗА ЗАФИКСИРОВАНА ДО ПРОГОНА. Оси: длина окна распределения и
# объявленное покрытие. Параметр k в этом режиме НЕ ЧИТАЕТСЯ (зафиксировано
# тестом) и потому в оси не входит: иначе сетка считала бы одну гипотезу
# дважды под разными config_id и дарила бы себе дубликаты в штрафе DSR.
#
# Основание. z считается в предположении нормальности: «две сигмы» покрывают
# 95 % только у нормального распределения, а у доходностей крипты хвосты
# тяжелее. Если хвост тяжелее, порог k·σ срабатывает там, где мы не думаем.
# Эмпирический квантиль берёт настоящее распределение окна.
#
# Уровень 90 % — не произвол: ровно его брал чужой индикатор. Там метод был
# сломан — эмпирический 90 %-диапазон сравнивался с теоретическим 2·k·σ, то
# есть с 4σ = 95.4 %, и порог оказывался занижен на 18 % ДАЖЕ на идеально
# нормальных данных (3.29 против 4.0). Здесь теоретического плеча нет вовсе:
# порог И ЕСТЬ квантиль объявленного уровня.
#
# quantile_window: 0 — выключено, порог k·σ. Это базовая точка для сравнения;
# при ней стратегия побитово равна базовой модели (проверено тестом).
#
# Чего здесь НЕТ: пересечения квантиля с ADX и сжатием. Причина та же, что в
# mr_filtered.yaml, — произведение осей дало бы сотни в основном бессмысленных
# комбинаций, а штраф DSR за них платится по-настоящему.
# ═══════════════════════════════════════════════════════════════════════════
experiment:
  name: mr_quantile
  strategy: mean_reversion_filtered
  timeframe: 1h
  start: "2022-01-01"
  end: "2025-12-31"
  params:
    window: 20
    k: 2.0
    atr_len: 14
    sl_atr: 2.0
    tp_atr: 6.0
    use_hl_filter: false
    hl_min: 5.0
    hl_max: 100.0
  costs:
    taker_fee_bps: 5.0
    maker_fee_bps: 2.0
    maker_share: 0.0
    impact_coef: 0.1
    min_slippage_bps: 0.5
  validation:
    n_permutations: 1000
    min_trades: 100
    max_pbo: 0.5
    max_p_value: 0.05

axes:
  symbols: [BTCUSDT, ETHUSDT]
  timeframes: [1h]
  params:
    quantile_window: [0, 100, 250, 500]
    coverage: [90, 95, 97.5, 99]
