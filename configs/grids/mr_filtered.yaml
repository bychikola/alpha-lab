# ═══════════════════════════════════════════════════════════════════════════
# ГИПОТЕЗЫ H1 (ADX) И H3 (сжатие волатильности).
#
# Идеи взяты из чужого индикатора (Dynamic Bollinger Bands) и переведены в
# форму, которую полигон может убить. ГИПОТЕЗЫ ЗАФИКСИРОВАНЫ ДО ПРОГОНА —
# это и есть разница между проверкой и подгонкой: если бы оси выбирались
# после того, как стали видны результаты, штраф DSR считался бы не за то
# число попыток, которое реально сделано.
#
# H1. Вход в MR только при СЛАБОМ тренде (adx_max) либо только при СИЛЬНОМ
#     (adx_min). Основание измеренное: в фазе 2 получено, что |z| ≥ 2 не
#     различает OU-процесс и случайное блуждание — на блуждании сигналов даже
#     больше (11.6 % против 9.3 %). Порог не является детектором возврата к
#     среднему, поэтому включение MR там, где рынок возвращается, — осмысленная
#     попытка это починить.
#
#     Направление adx_min (вход в тренде) тоже проверяется, хотя звучит
#     противоречиво: именно его подразумевает чужой код, где в тренде полосы
#     СУЖАЮТСЯ, то есть вход разрешается легче. Проверять только удобное
#     направление — это и есть отбор под желаемый ответ.
#
# H3. Вход только при сжатой волатильности: σ < sma(σ, окно)·ratio.
#     Классический аргумент: возврат к среднему — свойство тихого рынка, а
#     широкий размах означает новостной импульс, который против позиции.
#
# Чего здесь НЕТ и почему: комбинации фильтров с квантильным порогом (H2)
# вынесены в отдельный манифест mr_quantile.yaml. Декартово произведение всех
# осей дало бы сотни конфигураций, из которых осмысленны единицы, а штраф за
# них DSR заплатил бы по полной. Два манифеста — это две проверки, а не одна
# с обходом штрафа: обе пишут в одно хранилище и один журнал.
#
# ДЕФЕКТ ОСЕЙ, найденный по результату прогона и оставленный как есть: там,
# где adx_min >= adx_max, полоса не пересекается ни на одном баре, и все такие
# конфигурации заведомо пусты. Их 18 из 60 — они честно падают на гейте
# min_trades, но съедают прогон и раздувают число попыток в штрафе DSR.
# Перерисовывать сетку после того, как результат увиден, НЕЛЬЗЯ — это уже
# подгонка; поэтому сетка оставлена как зарегистрирована, а урок записан для
# будущих манифестов: пересекающиеся оси образуют вырожденные ячейки, и это
# надо ловить разбором осей до запуска, а не после.
#
# Сколько попыток уже сделано по MR: 144 (фаза 2) + 475 (E1) конфигураций.
# Журнал считает попытки по ключу (strategy, params, symbol, timeframe), и
# другое имя стратегии для него — другой поиск, поэтому своё число попыток
# здесь берётся из размера сетки, а общий итог честнее считать вручную. В
# разборе результата приводятся оба числа.
# ═══════════════════════════════════════════════════════════════════════════
experiment:
  name: mr_filtered
  strategy: mean_reversion_filtered
  timeframe: 1h
  start: "2022-01-01"
  end: "2025-12-31"
  params:
    window: 20
    k: 2.0
    atr_len: 14
    sl_atr: 2.0
    tp_atr: 6.0
    use_hl_filter: false
    hl_min: 5.0
    hl_max: 100.0
  costs:
    taker_fee_bps: 5.0
    maker_fee_bps: 2.0
    maker_share: 0.0
    impact_coef: 0.1
    min_slippage_bps: 0.5
  validation:
    n_permutations: 1000
    min_trades: 100
    max_pbo: 0.5
    max_p_value: 0.05

axes:
  symbols: [BTCUSDT, ETHUSDT]
  timeframes: [1h]
  params:
    # null = фильтр выключен. Строка «все null» — это базовая модель, точка
    # отсчёта: без неё воронка сравнивала бы фильтры только между собой и не
    # показала бы, добавили они что-нибудь или отняли.
    adx_max: [null, 15, 20, 25, 30]
    adx_min: [null, 25, 35]
    squeeze_ratio: [null, 0.8]
